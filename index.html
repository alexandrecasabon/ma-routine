<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<title>Ma routine</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#182747">

<!-- Mode plein écran une fois ajouté à l'écran d'accueil iPad -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ma routine">
<link rel="apple-touch-icon" href="icon-180.png">

<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ===== Le ciel : signature de l'app. Le soleil avance sur son arc à mesure
     que les étapes sont faites, et le fond du ciel change avec lui. ===== -->
<header id="ciel" aria-hidden="true">
  <svg viewBox="0 0 1000 190" preserveAspectRatio="none" id="arc">
    <path id="trajet" d="M60,178 Q500,-70 940,178" fill="none"
          stroke="rgba(255,255,255,.45)" stroke-width="3" stroke-dasharray="8 12"
          stroke-linecap="round"/>
    <g id="jalons"></g>
    <g id="astre">
      <circle id="halo" r="34" fill="rgba(255,255,255,.30)"/>
      <circle id="disque" r="21" fill="#FFC93C"/>
    </g>
  </svg>
</header>

<main>

  <!-- ===== Écran 1 : qui commence ? ===== -->
  <section class="ecran ecran--actif" id="ecran-enfants">
    <h1 class="titre">Qui commence&nbsp;?</h1>
    <div class="grille" id="liste-enfants"></div>
  </section>

  <!-- ===== Écran 2 : quelle routine ? ===== -->
  <section class="ecran" id="ecran-routines">
    <button class="retour" data-vers="ecran-enfants">← Changer</button>
    <h1 class="titre" id="titre-routines"></h1>
    <div class="grille" id="liste-routines"></div>
  </section>

  <!-- ===== Écran 3 : une étape à la fois ===== -->
  <section class="ecran ecran--etape" id="ecran-etape">
    <button class="retour" data-vers="ecran-routines">← Arrêter</button>

    <div class="carte-etape">
      <div class="anneau">
        <svg viewBox="0 0 200 200">
          <circle class="anneau__fond" cx="100" cy="100" r="88"/>
          <circle class="anneau__jauge" cx="100" cy="100" r="88" id="jauge"/>
        </svg>
        <div class="anneau__emoji" id="etape-emoji">🌅</div>
      </div>

      <p class="etape-rang" id="etape-rang"></p>
      <h2 class="etape-titre" id="etape-titre"></h2>
      <p class="etape-chrono" id="etape-chrono"></p>

      <button class="bouton-fait" id="bouton-fait">
        <span class="bouton-fait__coche">✓</span>
        <span>C'est fait</span>
      </button>
    </div>
  </section>

  <!-- ===== Écran 4 : bravo ===== -->
  <section class="ecran ecran--fin" id="ecran-fin">
    <div class="etoiles" id="etoiles-gagnees"></div>
    <h1 class="titre" id="titre-fin">Routine terminée</h1>
    <p class="sous-titre" id="sous-titre-fin"></p>
    <button class="bouton-fait bouton-fait--calme" data-vers="ecran-enfants">Retour</button>
  </section>

  <!-- ===== Écran 5 : réglages (parent) ===== -->
  <section class="ecran ecran--parent" id="ecran-parent">
    <button class="retour" data-vers="ecran-enfants">← Fermer</button>
    <h1 class="titre">Réglages</h1>

    <div class="panneau">
      <h2 class="panneau__titre">Enfants</h2>
      <div id="reglages-enfants"></div>
      <button class="btn-ajout" id="ajout-enfant">+ Ajouter un enfant</button>
    </div>

    <div class="panneau">
      <h2 class="panneau__titre">Routines</h2>
      <div id="reglages-routines"></div>
    </div>

    <div class="panneau">
      <h2 class="panneau__titre">Sauvegarde</h2>
      <p class="note">Les données vivent uniquement sur cet iPad. Exporte de temps en temps
         pour ne rien perdre si l'app est retirée de l'écran d'accueil.</p>
      <div class="rangee-boutons">
        <button class="btn-ajout" id="exporter">Exporter un fichier</button>
        <label class="btn-ajout">Importer un fichier
          <input type="file" id="importer" accept="application/json" hidden>
        </label>
        <button class="btn-ajout btn-ajout--danger" id="reinitialiser">Tout effacer</button>
      </div>
    </div>
  </section>

</main>

<!-- Accès parent : maintenir 1,5 s -->
<button id="cle-parent" aria-label="Réglages (maintenir)">⚙</button>

<script src="app.js" defer></script>
</body>
</html>
